<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>硬件面试题库导航</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="题库筛选">
        <div class="brand">
          <span class="brand-mark">HW</span>
          <div>
            <strong>硬件面试题库</strong>
            <small>GitHub 题源整理版</small>
          </div>
        </div>

        <div class="control-group">
          <label for="searchInput">搜索题目</label>
          <div class="search-box">
            <span aria-hidden="true">⌕</span>
            <input id="searchInput" type="search" placeholder="输入 FPGA、MOSFET、SPI..." />
          </div>
        </div>

        <div class="control-group">
          <span class="label">公司类型</span>
          <div class="segmented" role="group" aria-label="公司类型">
            <button class="is-active" data-filter="company" data-value="all">全部</button>
            <button data-filter="company" data-value="big">大厂</button>
            <button data-filter="company" data-value="small">小厂</button>
          </div>
        </div>

        <div class="control-group">
          <span class="label">技术方向</span>
          <div class="chip-list" id="domainFilters"></div>
        </div>

        <div class="control-group">
          <span class="label">难度</span>
          <div class="chip-list compact" id="levelFilters"></div>
        </div>

        <div class="control-group">
          <span class="label">求职专项</span>
          <div class="chip-list" id="trackFilters"></div>
        </div>
        <div class="control-group">
          <span class="label">学习记录</span>
          <div class="chip-list" id="studyFilters"></div>
        </div>

        <div class="source-card">
          <span>题源</span>
          <a href="https://github.com/mikinty/Hardware-Engineer-Interview-Questions" target="_blank" rel="noreferrer">Hardware-Engineer-Interview-Questions</a>
          <a href="https://github.com/pengwubj/hw_interview_questions" target="_blank" rel="noreferrer">hw_interview_questions</a>
          <a href="https://github.com/GaetanoLongo/PowerElectronics" target="_blank" rel="noreferrer">PowerElectronics</a>
          <a href="https://github.com/IAS-Uni-Siegen/PE_course" target="_blank" rel="noreferrer">PE_course</a>
          <a href="https://github.com/tabler/tabler" target="_blank" rel="noreferrer">界面参考 Tabler</a>
        </div>
      </aside>

      <main class="main">
        <section class="hero">
          <img src="./assets/hardware-banner.png" alt="电路板与硬件实验室背景" />
          <div class="hero-overlay">
            <p>Hardware Interview Kit</p>
            <h1>按大厂与小厂侧重点整理的硬件面试题库</h1>
            <div class="hero-actions">
              <button id="focusBig" type="button">大厂高频</button>
              <button id="focusSmall" type="button">小厂实战</button>
            </div>
          </div>
        </section>

        <section class="stats" aria-label="题库统计">
          <article>
            <span id="totalCount">0</span>
            <p>当前题目</p>
          </article>
          <article>
            <span id="bigCount">0</span>
            <p>偏大厂题</p>
          </article>
          <article>
            <span id="smallCount">0</span>
            <p>偏小厂题</p>
          </article>
          <article>
            <span id="domainCount">0</span>
            <p>技术方向</p>
          </article>
        </section>

        <section class="learning-panel" aria-label="学习进度">
          <strong id="learningSummary"></strong>
          <label for="masteryProgress">全题库掌握进度（自评）</label>
          <progress id="masteryProgress" value="0" max="277"></progress>
          <div class="study-actions">
            <button type="button" data-mode="practice" aria-pressed="true">逐题训练</button>
            <button type="button" data-mode="browse" aria-pressed="false">题库浏览</button>
            <button type="button" id="exportProgress">导出学习记录</button>
          </div>
          <p id="storageStatus" role="status"></p>
          <small>思路与自评保存在当前浏览器；建议定期导出备份。查看答案本身不代表掌握。</small>
        </section>

        <section class="toolbar" aria-label="排序工具">
          <div>
            <strong id="resultTitle">全部题目</strong>
            <span id="resultHint">覆盖模拟、数字、FPGA、嵌入式与系统设计</span>
          </div>
          <select id="sortSelect" aria-label="排序方式">
            <option value="default">默认排序</option>
            <option value="level">按难度排序</option>
            <option value="domain">按方向排序</option>
          </select>
        </section>

        <nav class="practice-nav" id="practiceNav" aria-label="逐题切换">
          <button type="button" id="previousQuestion">上一题</button>
          <span id="practicePosition" role="status"></span>
          <button type="button" id="nextQuestion">下一题</button>
        </nav>
        <section id="questionGrid" class="question-grid" aria-live="polite"></section>
      </main>
    </div>

    <template id="questionTemplate">
      <article class="question-card">
        <div class="card-top">
          <span class="domain"></span>
          <span class="level"></span>
        </div>
        <h2></h2>
        <p class="mastery-status"></p>
        <label class="draft-label">先写下你的思路（可选）
          <textarea class="draft" rows="4" maxlength="4000" placeholder="先说原理，再列测试步骤、判断依据和排查顺序……"></textarea>
        </label>
        <button class="reveal-answer" type="button" aria-expanded="false">想好了，查看答案</button>
        <div class="answer-content" hidden>
          <h3>参考答案 / 提示</h3>
          <p class="answer"></p>
          <div class="coaching"></div>
          <fieldset class="rating">
            <legend>对照答案，自评掌握程度</legend>
            <button type="button" data-rating="weak">不会 · 加入错题本</button>
            <button type="button" data-rating="learning">不熟 · 继续复习</button>
            <button type="button" data-rating="mastered">已掌握</button>
          </fieldset>
        </div>
        <button class="wrong-toggle" type="button">加入错题本</button>
        <div class="tags"></div>
      </article>
    </template>

    <script src="./coaching.js"></script>
    <script src="./app.js"></script>
    <script src="./learning.js"></script>
  </body>
</html>
